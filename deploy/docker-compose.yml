# 用法（在项目根目录）：
#   cp deploy/.env.example deploy/.env           # 填域名和密钥
#   cp deploy/models.example.json deploy/models.json   # 按需修改
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs app   # 第一次启动时这里有安装码
name: lovememo

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?在 deploy/.env 里设置 DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - app-data:/data
      - ./models.json:/config/models.json:ro
    # 不对外暴露端口，只有 caddy 能访问
    expose: ["8787"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
