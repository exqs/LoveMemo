# 用法（在项目根目录）：
#   cp deploy/.env.example deploy/.env           # 选访问方式（https/http），填域名和密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs app   # 第一次启动时这里有安装码
name: lovememo

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # 访问方式跟着 COMPOSE_PROFILES 走，保证应用和前面的 Caddy 用的是同一种
      SCHEME: ${COMPOSE_PROFILES:?在 deploy/.env 里设置 COMPOSE_PROFILES=https 或 http}
      DOMAIN: ${DOMAIN:?在 deploy/.env 里设置 DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - app-data:/data
    # 不对外暴露端口，只有 caddy 能访问
    expose: ["8787"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200

  # https 模式：自动申请证书，需要 80 和 443 端口
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # http 模式：不加密、不需要证书，只用 80 端口
  caddy-http:
    image: caddy:2
    profiles: [http]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.http:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
