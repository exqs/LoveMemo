# 用法（在项目根目录）：
#   cp deploy/.env.example deploy/.env           # 选访问方式（https-ip / https / http），填 IP 或域名、密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs app   # 第一次启动时这里有安装码
name: lovememo

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # 访问方式跟着 COMPOSE_PROFILES 走，保证应用和前面的 Caddy 用的是同一种。
      # DOMAIN / SERVER_IP / HTTPS_PORT 从 .env 读，缺了哪个应用启动时会说
      ACCESS_MODE: ${COMPOSE_PROFILES:?在 deploy/.env 里设置 COMPOSE_PROFILES=https-ip、https 或 http}
      TRUST_PROXY: "1"
    volumes:
      - app-data:/data
    # 不对外暴露端口，只有 caddy 能访问
    expose: ["8787"]
    networks: [internal]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200

  # https + IP + 端口（默认）：不需要域名。80 端口用来申请证书，HTTPS_PORT 是访问端口
  caddy-ip:
    image: caddy:2
    profiles: [https-ip]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}/udp"
    environment:
      SERVER_IP: ${SERVER_IP:-}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      # 证书和自签名用的根证书都在这里，不要删，删了自签名的根证书会变，大家要重新信任
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # https + 域名：自动申请证书，需要 80 和 443 端口
  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # http 模式：不加密、不需要证书，只用 80 端口
  caddy-http:
    image: caddy:2
    profiles: [http]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.http:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
